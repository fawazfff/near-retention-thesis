name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest -v
      - name: Validate published research dataset
        run: python -c "from pathlib import Path; from nearret.metrics import load, analyse; data, meta = load(Path('data/retention.csv'), Path('data/run_meta.json')); result = analyse(data); assert len(data['filtered_50']) == 40; assert result['headline']['verdict'] == 'no clear change'; print('Validated 40 cohorts; week-4 verdict:', result['headline']['verdict'])"
      - name: Rebuild written thesis from the published real dataset
        run: python rebuild.py
      - run: python rebuild.py --demo
